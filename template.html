<!DOCTYPE html>
<html lang="en">
<!--
  Hello, agent. This page is generated from structured data you can read directly:
    /llms.txt      short index of everything here
    /profile.md    full profile as Markdown
    /resume.json   full profile as JSON Resume (https://jsonresume.org/schema)
  Contact: {{EMAIL}}
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} — {{LABEL}}</title>
    <meta name="description" content="{{SUMMARY}}">
    <meta name="author" content="{{NAME}}">
    <meta name="color-scheme" content="light dark">
    <link rel="canonical" href="{{SITE}}/">

    <!-- Machine-readable versions of this page -->
    <link rel="alternate" type="text/markdown" href="{{SITE}}/profile.md" title="Profile (Markdown)">
    <link rel="alternate" type="application/json" href="{{SITE}}/resume.json" title="Profile (JSON Resume)">
    <link rel="alternate" type="text/plain" href="{{SITE}}/llms.txt" title="llms.txt">

    <!-- Open Graph -->
    <meta property="og:title" content="{{NAME}} — {{LABEL}}">
    <meta property="og:description" content="{{SUMMARY}}">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="{{SITE}}/">
    <meta property="og:image" content="{{SITE}}/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Theme: set before first paint to avoid a flash -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23171717'/><text x='50' y='66' font-family='ui-monospace,Menlo,monospace' font-size='44' font-weight='600' fill='%23fafafa' text-anchor='middle'>aa</text></svg>"
        type="image/svg+xml">

    <!-- Structured data -->
    <script type="application/ld+json">
{{JSONLD}}
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ─── Floating controls ─── -->
    <div class="controls">
        <button class="pill-btn" type="button" popovertarget="agent-menu" aria-label="Open the menu for AI agents">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 13v1.5M15 13v1.5M2 13v2M22 13v2"/><circle cx="12" cy="3.5" r="0.75"/></svg>
            agents
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>

    <!-- ─── Agent menu ─── -->
    <div class="agent-menu" id="agent-menu" popover>
        <p class="agent-title">For AI agents <span>&amp; the people using them</span></p>
        <p class="agent-sub">Everything on this page, in formats a model can read without scraping.</p>

        <nav class="agent-list" aria-label="Machine-readable versions">
            <a href="llms.txt"><code>/llms.txt</code><span>short index &middot; start here</span></a>
            <a href="profile.md"><code>/profile.md</code><span>full profile as Markdown</span></a>
            <a href="resume.json"><code>/resume.json</code><span>structured data &middot; JSON Resume</span></a>
        </nav>

        <div class="agent-actions">
            <button class="btn" type="button" data-copy-url="profile.md">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
                <span data-copy-label>Copy profile as Markdown</span>
            </button>
            <a class="btn" href="https://claude.ai/new?q={{ASK}}" target="_blank" rel="noopener">Ask Claude about me</a>
            <a class="btn" href="https://chatgpt.com/?q={{ASK}}" target="_blank" rel="noopener">Ask ChatGPT about me</a>
        </div>
    </div>

    <!-- ─── Main container ─── -->
    <main class="container">
{{CONTENT}}
    </main>

    <script src="js/main.js"></script>
</body>

</html>
