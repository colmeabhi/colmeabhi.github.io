<!DOCTYPE html>
<html lang="en">
<!--
  Hello, agent. This page is generated from structured data you can read directly:
    /llms.txt      short index of everything here
    /profile.md    full profile as Markdown
    /resume.json   full profile as JSON Resume (https://jsonresume.org/schema)
  Contact: {{EMAIL}}
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="author" content="{{NAME}}">
    <meta name="color-scheme" content="light dark">
    <link rel="canonical" href="{{CANONICAL}}">

    <!-- Machine-readable versions of this page -->
    <link rel="alternate" type="text/markdown" href="{{SITE}}/profile.md" title="Profile (Markdown)">
    <link rel="alternate" type="application/json" href="{{SITE}}/resume.json" title="Profile (JSON Resume)">
    <link rel="alternate" type="text/plain" href="{{SITE}}/llms.txt" title="llms.txt">{{ALTERNATE}}

    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="{{OGTYPE}}">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:image" content="{{SITE}}/og-image.png?v={{V}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Abhishek Ahirrao, platform and software engineer">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{SITE}}/og-image.png?v={{V}}">

    <!-- Theme: set before first paint to avoid a flash -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" href="{{ROOT}}favicon.svg?v={{V}}" type="image/svg+xml">
    <link rel="icon" href="{{ROOT}}favicon-32.png?v={{V}}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ROOT}}apple-touch-icon.png?v={{V}}">

    <!-- Structured data -->
    <script type="application/ld+json">
{{JSONLD}}
    </script>

    <link rel="stylesheet" href="{{ROOT}}css/style.css?v={{V}}">
</head>

<body class="{{BODYCLASS}}">

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <!-- ─── Main container ─── -->
    <main class="container">
{{CONTENT}}
    </main>

    <script src="{{ROOT}}js/main.js?v={{V}}"></script>
    <script src="{{ROOT}}js/demos.js?v={{V}}"></script>{{EXTRA_JS}}
</body>

</html>
