<svg viewBox="0 0 680 270" role="img" aria-label="Control loop: the controller scrapes cache metrics from each vLLM pod, scores them, and writes a pod-deletion-cost annotation that the ReplicaSet controller uses on scale-down">
  <defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="d-head"/></marker></defs>
  <g class="d-box">
    <rect x="10" y="20" width="150" height="54" rx="8"/><rect x="10" y="94" width="150" height="54" rx="8"/><rect x="10" y="168" width="150" height="54" rx="8"/>
    <rect x="255" y="74" width="180" height="94" rx="8" class="d-strong"/>
    <rect x="520" y="20" width="150" height="74" rx="8"/><rect x="520" y="168" width="150" height="74" rx="8"/>
  </g>
  <g class="d-text">
    <text x="26" y="43">vLLM pod A</text><text x="26" y="117">vLLM pod B</text><text x="26" y="191">vLLM pod C</text>
    <text x="345" y="102" text-anchor="middle" class="d-title">controller</text>
    <text x="536" y="45" class="d-title">API server</text><text x="536" y="193" class="d-title">ReplicaSet</text>
  </g>
  <g class="d-muted">
    <text x="26" y="61">hit rate 70%</text><text x="26" y="135">hit rate 55%</text><text x="26" y="209">hit rate 5%</text>
    <text x="345" y="124" text-anchor="middle">scrape, score, patch</text><text x="345" y="142" text-anchor="middle">every 5 s</text>
    <text x="536" y="63">pod-deletion-cost</text><text x="536" y="79">A 700 · B 550 · C 50</text>
    <text x="536" y="211">on scale-down:</text><text x="536" y="227">lowest cost first</text>
    <text x="207" y="64" text-anchor="middle">/metrics</text>
    <text x="478" y="60" text-anchor="middle">patch</text>
    <text x="606" y="136" text-anchor="middle">reads</text>
  </g>
  <g class="d-line" marker-end="url(#ah1)">
    <path d="M160 47 C210 47 215 100 255 104"/><path d="M160 121 H255"/><path d="M160 195 C210 195 215 142 255 138"/>
    <path d="M435 104 C480 104 480 57 520 57"/>
    <path d="M595 168 V94"/>
  </g>
  <path class="d-accent" marker-end="url(#ah1)" d="M520 222 C380 262 240 250 160 206"/>
  <text class="d-accent-text" x="345" y="262" text-anchor="middle">removes pod C, the coldest cache</text>
</svg>
