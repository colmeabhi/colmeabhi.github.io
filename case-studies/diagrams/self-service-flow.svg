<svg viewBox="0 0 680 250" role="img" aria-label="Request flow: a request in plain English or from the CLI goes to the LLM, which only picks a template and fills its variables. Then the variables are validated, a plan is shown, costly tiers wait for a human approval, the stack is applied in the dev account, and it is torn down when its time to live runs out.">
  <defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="d-head"/></marker></defs>
  <g class="d-box">
    <rect x="10" y="20" width="140" height="64" rx="8"/>
    <rect x="186" y="20" width="140" height="64" rx="8" class="d-strong"/>
    <rect x="362" y="20" width="140" height="64" rx="8"/>
    <rect x="538" y="20" width="132" height="64" rx="8"/>
    <rect x="538" y="150" width="132" height="64" rx="8"/>
    <rect x="362" y="150" width="140" height="64" rx="8"/>
    <rect x="186" y="150" width="140" height="64" rx="8"/>
  </g>
  <g class="d-text">
    <text x="24" y="46" class="d-title">Request</text>
    <text x="200" y="46" class="d-title">LLM</text>
    <text x="376" y="46" class="d-title">Validate</text>
    <text x="552" y="46" class="d-title">Plan</text>
    <text x="552" y="176" class="d-title">Approval</text>
    <text x="376" y="176" class="d-title">Apply in dev</text>
    <text x="200" y="176" class="d-title">Expire</text>
  </g>
  <g class="d-muted">
    <text x="24" y="66">chat or CLI</text>
    <text x="200" y="66">picks a template,</text><text x="200" y="79">fills its variables</text>
    <text x="376" y="66">known template,</text><text x="376" y="79">tags, sizes</text>
    <text x="552" y="66">plan or change set</text>
    <text x="552" y="196">costly tiers only</text>
    <text x="376" y="196">tagged, narrow IAM</text>
    <text x="200" y="196">time to live ends,</text><text x="200" y="209">stack tears down</text>
  </g>
  <g class="d-line">
    <path d="M150 52H184" marker-end="url(#ah4)"/>
    <path d="M326 52H360" marker-end="url(#ah4)"/>
    <path d="M502 52H536" marker-end="url(#ah4)"/>
    <path d="M604 84V148" marker-end="url(#ah4)"/>
    <path d="M538 182H504" marker-end="url(#ah4)"/>
    <path d="M362 182H328" marker-end="url(#ah4)"/>
  </g>
  <rect x="180" y="12" width="152" height="80" rx="11" class="d-accent"/>
  <text x="256" y="110" text-anchor="middle" class="d-accent-text">the only step the model touches</text>
</svg>
